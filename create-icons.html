<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <h2>Icon Generator</h2>
    <p>Buka file ini di browser, lalu klik kanan pada icon dan "Save Image As" untuk menyimpan sebagai icon-192.png dan icon-512.png</p>
    
    <h3>Icon 192x192:</h3>
    <canvas id="canvas192" width="192" height="192" style="border: 1px solid #ccc;"></canvas>
    
    <h3>Icon 512x512:</h3>
    <canvas id="canvas512" width="512" height="512" style="border: 1px solid #ccc;"></canvas>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#1e3a8a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📅', size / 2, size / 2 - size * 0.05);
            
            ctx.font = `bold ${size * 0.15}px Arial`;
            ctx.fillText('26', size / 2, size / 2 + size * 0.25);
        }

        drawIcon(document.getElementById('canvas192'), 192);
        drawIcon(document.getElementById('canvas512'), 512);

        // Auto download
        setTimeout(() => {
            const canvas192 = document.getElementById('canvas192');
            const canvas512 = document.getElementById('canvas512');
            
            canvas192.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'icon-192.png';
                a.click();
            });

            setTimeout(() => {
                canvas512.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'icon-512.png';
                    a.click();
                });
            }, 500);
        }, 1000);
    </script>
</body>
</html>
