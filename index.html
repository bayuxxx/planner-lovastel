<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="Aplikasi Jadwal Lovastel 2026 - Kelola jadwal dengan mudah">
    <title>Lovastel Planner 2026</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 900: '#1e3a8a' }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 font-sans pb-24 antialiased min-h-screen smooth-scroll selection:bg-pink-200">

    <div class="max-w-md mx-auto w-full relative z-10">
        
        <!-- Header -->
        <header class="pt-8 pb-4 px-6 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Jadwal<span class="text-blue-500">26</span></h1>
                <p class="text-slate-500 font-medium mt-1 text-sm" id="todayText">Tetap semangat! ✨</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openAddModal()" class="w-10 h-10 rounded-full glass-panel flex justify-center items-center text-lg shadow-sm hover:scale-110 transition-transform active:scale-95">➕</button>
                <button onclick="toggleAlarmPanel()" class="w-10 h-10 rounded-full glass-panel flex justify-center items-center text-lg shadow-sm hover:scale-110 transition-transform active:scale-95" id="alarmBtn">�</button>
            </div>
        </header>

        <!-- Month Filter -->
        <div class="px-2 mb-4">
            <div class="no-scrollbar flex overflow-x-auto gap-2 px-4 py-2" id="monthFilter"></div>
        </div>

        <!-- Interactive Calendar Widget -->
        <div class="px-6 mb-6">
            <div class="glass-panel rounded-3xl p-5 shadow-glass">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-lg text-slate-800" id="calendarTitle">Bulan</h2>
                </div>
                <!-- Days Header -->
                <div class="grid grid-cols-7 gap-1 text-center mb-2">
                    <div class="text-[0.65rem] font-bold text-red-400">Min</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Sen</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Sel</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Rab</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Kam</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Jum</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Sab</div>
                </div>
                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-y-2 gap-x-1" id="calendarGrid"></div>
            </div>
        </div>

        <!-- Schedule List -->
        <div class="px-6 flex flex-col gap-4" id="scheduleList"></div>

    </div>

    <!-- Modal Add/Edit -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="glass-panel rounded-3xl p-6 max-w-md w-full shadow-2xl animate-scale-in">
            <h2 class="text-2xl font-bold mb-4 text-slate-900" id="modalTitle">Tambah Jadwal</h2>
            <form id="scheduleForm" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Bulan</label>
                    <select id="inputMonth" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition">
                        <option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option>November</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Tanggal</label>
                    <input type="number" id="inputDay" min="1" max="31" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Waktu</label>
                    <select id="inputTime" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition">
                        <option>Subuh</option><option>Pagi</option><option>Siang</option><option>Sore</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Lokasi</label>
                    <input type="text" id="inputLocation" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none transition" required>
                </div>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="inputMake" class="w-5 h-5 rounded accent-pink-500">
                        <span class="text-sm font-bold text-slate-700">💄 Makeup</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="inputDouble" class="w-5 h-5 rounded accent-orange-500">
                        <span class="text-sm font-bold text-slate-700">🔥 Double</span>
                    </label>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 px-6 py-3 rounded-xl bg-slate-200 text-slate-700 font-bold hover:bg-slate-300 transition">Batal</button>
                    <button type="submit" class="flex-1 px-6 py-3 rounded-xl bg-blue-500 text-white font-bold hover:bg-blue-600 transition shadow-lg">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alarm Panel -->
    <div id="alarmPanel" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="glass-panel rounded-3xl p-6 max-w-md w-full shadow-2xl animate-scale-in max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-slate-900">🔔 Alarm Aktif</h2>
                <button onclick="toggleAlarmPanel()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="alarmList" class="space-y-3"></div>
            <p class="text-xs text-slate-500 mt-4 text-center">Alarm akan berbunyi 30 menit sebelum jadwal</p>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="app.js"></script>
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('SW registered'));
        }
    </script>
</body>
</html>
