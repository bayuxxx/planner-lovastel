<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lovastel Planner 2026</title>
    
    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 900: '#1e3a8a' }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f0fdf4; background-image: radial-gradient(at 0% 0%, #e0f2fe 0px, transparent 50%), radial-gradient(at 100% 0%, #fae8ff 0px, transparent 50%); background-attachment: fixed; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .smooth-scroll { scroll-behavior: smooth; }
    </style>
</head>
<body class="text-slate-800 font-sans pb-24 antialiased min-h-screen smooth-scroll selection:bg-pink-200">

    <div class="max-w-md mx-auto w-full relative z-10">
        
        <!-- Header -->
        <header class="pt-8 pb-4 px-6 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Jadwal<span class="text-blue-500">26</span></h1>
                <p class="text-slate-500 font-medium mt-1 text-sm" id="todayText">Tetap semangat! ✨</p>
            </div>
            <div class="flex gap-2">
                <span class="w-8 h-8 rounded-full glass-panel flex justify-center items-center text-sm shadow-sm">😷</span>
                <span class="w-8 h-8 rounded-full glass-panel flex justify-center items-center text-sm shadow-sm">💊</span>
                <span class="w-8 h-8 rounded-full glass-panel flex justify-center items-center text-sm shadow-sm">💧</span>
            </div>
        </header>

        <!-- Month Filter -->
        <div class="px-2 mb-4">
            <div class="no-scrollbar flex overflow-x-auto gap-2 px-4 py-2" id="monthFilter"></div>
        </div>

        <!-- Interactive Calendar Widget -->
        <div class="px-6 mb-6">
            <div class="glass-panel rounded-3xl p-5 shadow-glass">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="font-bold text-lg text-slate-800" id="calendarTitle">Bulan</h2>
                </div>
                <!-- Days Header -->
                <div class="grid grid-cols-7 gap-1 text-center mb-2">
                    <div class="text-[0.65rem] font-bold text-red-400">Min</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Sen</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Sel</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Rab</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Kam</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Jum</div>
                    <div class="text-[0.65rem] font-bold text-slate-400">Sab</div>
                </div>
                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-y-2 gap-x-1" id="calendarGrid"></div>
            </div>
        </div>

        <!-- Schedule List -->
        <div class="px-6 flex flex-col gap-4" id="scheduleList"></div>

    </div>

            { m: 'Oktober', d: '17', t: 'Pagi', l: 'Taliwang', make: false, dbl: false },
            { m: 'Oktober', d: '24', t: 'Subuh', l: 'Taliwang', make: false, dbl: false },
            { m: 'Oktober', d: '24', t: 'Sore', l: 'Taliwang', make: false, dbl: false },
            { m: 'November', d: '22', t: 'Subuh', l: 'Taliwang', make: true, dbl: false }
        ];

        // Setup Kalender 2026 (0 = Minggu, 1 = Senin, dst)
        const calendarSetup = {
            'Mei': { days: 31, startDay: 5 },       // 1 Mei Jumat
            'Juni': { days: 30, startDay: 1 },      // 1 Juni Senin
            'Juli': { days: 31, startDay: 3 },      // 1 Juli Rabu
            'Agustus': { days: 31, startDay: 6 },   // 1 Ags Sabtu
            'September': { days: 30, startDay: 2 }, // 1 Sep Selasa
            'Oktober': { days: 31, startDay: 4 },   // 1 Okt Kamis
            'November': { days: 30, startDay: 0 }   // 1 Nov Minggu
        };

        const months = Object.keys(calendarSetup);
        let activeMonth = 'Mei'; // Default terbuka di Mei sesuai kalender saat ini

        function init() {
            renderFilters();
            updateView(activeMonth);
        }

        function updateView(month) {
            activeMonth = month;
            document.getElementById('calendarTitle').innerText = `${month} 2026`;
            renderFilters();
            renderCalendar(month);
            renderSchedule(month);
        }

        function renderFilters() {
            const container = document.getElementById('monthFilter');
            container.innerHTML = '';
            months.forEach(month => {
                const btn = document.createElement('button');
                const isActive = month === activeMonth;
                btn.className = `px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all duration-300 flex-shrink-0 ${isActive ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-slate-500 shadow-sm'}`;
                btn.innerText = month;
                btn.onclick = () => updateView(month);
                container.appendChild(btn);
            });
        }

        function renderCalendar(month) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const config = calendarSetup[month];
            
            // Filter pekerjaan bulan ini buat dapetin indikator titik
            const jobsThisMonth = rawData.filter(j => j.m === month);

            // Kolom kosong awal bulan
            for(let i = 0; i < config.startDay; i++) {
                grid.innerHTML += `<div></div>`;
            }

            // Tanggal
            for(let day = 1; day <= config.days; day++) {
                const dayJobs = jobsThisMonth.filter(j => parseInt(j.d) === day);
                const hasJob = dayJobs.length > 0;
                
                // Cari tipe job hari itu untuk warna titik indikator
                let dotColors = [];
                if(hasJob) {
                    if(dayJobs.some(j => j.dbl)) dotColors.push('bg-orange-500');
                    if(dayJobs.some(j => j.make)) dotColors.push('bg-pink-500');
                    if(dotColors.length === 0) dotColors.push('bg-blue-500'); 
                }

                const dotsHtml = hasJob ? `<div class="flex justify-center gap-0.5 mt-1">` + 
                    dotColors.slice(0,2).map(c => `<div class="w-1.5 h-1.5 rounded-full ${c}"></div>`).join('') + 
                    `</div>` : `<div class="h-2.5"></div>`; // spacer agar tinggi seragam

                // Desain tombol tanggal
                const btnClass = hasJob ? 
                    'w-full aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer transition active:scale-95 bg-white shadow-sm border border-slate-100 hover:border-blue-300 text-slate-800 font-bold' : 
                    'w-full aspect-square rounded-xl flex flex-col items-center justify-center text-slate-400 font-medium';

                grid.innerHTML += `
                    <button class="${btnClass}" ${hasJob ? `onclick="scrollToJob('${month}-${day}')"` : ''}>
                        <span class="text-sm">${day}</span>
                        ${dotsHtml}
                    </button>
                `;
            }
        }

        function renderSchedule(month) {
            const listContainer = document.getElementById('scheduleList');
            listContainer.innerHTML = '';
            
            const filteredData = rawData.filter(item => item.m === month);

            if(filteredData.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 glass-panel rounded-3xl"><h3 class="text-lg font-bold text-slate-700">Bulan Kosong</h3><p class="text-sm text-slate-500">Waktunya istirahat di bulan ${month}!</p></div>`;
                return;
            }

            filteredData.forEach(job => {
                const card = document.createElement('div');
                card.id = `job-${month}-${job.d}`; // ID untuk fitur click-to-scroll
                
                const cardColor = job.dbl ? "border-orange-200 bg-orange-50/50" : job.make ? "border-pink-200 bg-pink-50/50" : "border-slate-100 bg-white/60";
                
                let badges = '';
                if(job.make) badges += `<span class="bg-pink-100 text-pink-700 text-[0.65rem] font-bold px-2 py-1 rounded-md">💄 Makeup</span>`;
                if(job.dbl) badges += `<span class="bg-orange-500 text-white text-[0.65rem] font-bold px-2 py-1 rounded-md shadow-sm">🔥 Double</span>`;

                card.innerHTML = `
                    <div class="glass-panel rounded-2xl p-4 flex gap-4 items-center border ${cardColor}">
                        <div class="w-14 h-14 shrink-0 rounded-2xl bg-white shadow-sm flex flex-col justify-center items-center">
                            <span class="text-[0.65rem] font-bold text-slate-400 uppercase">${job.m.slice(0,3)}</span>
                            <span class="text-xl font-black text-slate-800 leading-tight">${job.d}</span>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-800 capitalize text-lg">${job.l}</h3>
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide flex items-center gap-1 mt-0.5">
                                🕒 ${job.t}
                            </p>
                        </div>
                        <div class="flex flex-col gap-1 items-end shrink-0">${badges}</div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Fitur Tap-to-Scroll dari kalender ke jadwal yang sesuai
        function scrollToJob(id) {
            const el = document.getElementById(`job-${id}`);
            if(el) {
                // Efek highlight sesaat
                el.classList.add('ring-4', 'ring-blue-300', 'transition-all');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => el.classList.remove('ring-4', 'ring-blue-300'), 1500);
            }
        }

        init();
    </script>
</body>
